name: Redact Meta-Analysis Academy TA certificate

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/redact_meta_ta.py'
      - '.github/workflows/redact-meta-ta.yml'

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: pip install pymupdf pillow

      - name: Redact public certificate
        run: python .github/scripts/redact_meta_ta.py

      - name: Commit redacted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/Meta_Analysis_Academy_TA_Certificate.pdf assets/thumbs/Meta_Analysis_Academy_TA_Certificate.webp
          git diff --cached --quiet && exit 0
          git commit -m "Redact public Meta-Analysis Academy TA certificate"
          git push
